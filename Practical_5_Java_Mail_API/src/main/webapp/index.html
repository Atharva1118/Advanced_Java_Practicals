
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Email</title>
</head>
<body>

    <h2>EMAIL SENDING</h2>

    <form action="EmailSending" method="post">

        Receiver Address:
        <input type="email" name="receiver" required><br><br>

        Subject:
        <input type="text" name="subject" required><br><br>

        Message:<br>
        <textarea name="message" rows="8" cols="40" required></textarea>
        <br><br>

        <input type="submit" value="Send">

    </form>

</body>
</html>
