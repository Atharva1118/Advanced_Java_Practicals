
<!DOCTYPE html>
<html>
<head>

    <title>Personal Details</title>
</head>
<body>

    <h2>User Registration Form</h2>

    <h3>Personal Details</h3>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
